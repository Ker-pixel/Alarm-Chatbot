<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad)"/>
  
  <!-- Sun rays -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FF6B35" stroke-width="20" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFD23F" stroke-width="15" opacity="0.5"/>
  
  <!-- Central sun -->
  <circle cx="256" cy="256" r="100" fill="#FF6B35"/>
  <circle cx="256" cy="256" r="70" fill="#FFD23F"/>
  
  <!-- Alarm clock bell -->
  <circle cx="200" cy="150" r="15" fill="#00D9FF"/>
  <circle cx="312" cy="150" r="15" fill="#00D9FF"/>
  
  <!-- Exclamation mark -->
  <rect x="240" y="220" width="32" height="90" rx="8" fill="#0A0A0A"/>
  <circle cx="256" cy="340" r="18" fill="#0A0A0A"/>
</svg>
